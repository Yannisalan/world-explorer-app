<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Login | World Explorer</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="app-icon.svg">
    <link rel="stylesheet" href="styles.css?v=20260622-ui-v2">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-visual" aria-label="World Explorer">
        <span class="brand-mark" aria-hidden="true">W</span>
        <h1>World Explorer</h1>
        <p>Explore the globe, save the places you have seen, and keep a clean wishlist for the next trip.</p>
    </section>

    <section class="auth-panel" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Welcome Back</h2>
        <p>Sign in to open your travel map.</p>

        <div class="auth-message" id="registeredMessage" hidden>Account created. You can sign in now.</div>
        <div class="auth-message" id="deletedMessage" hidden>Your account and all saved countries have been deleted.</div>
        <div class="auth-error" id="loginError" hidden></div>

        <form class="auth-form" action="login.php" method="POST">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="auth-footer">New here? <a href="register.html">Create account</a></p>
    </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
// Login stays a real form POST to the API rather than a fetch(). The response
// is a 302 to this page's origin, so the browser navigates there directly and
// no CORS negotiation is involved. The cookie still has to be accepted on this
// cross-site response, which the API's SameSite=None cookie permits.
document.querySelector(".auth-form").action = apiUrl("login.php");
</script>
<script>
const params = new URLSearchParams(window.location.search);
const loginError = document.getElementById("loginError");
const loginMessages = {
    "1": "Invalid email or password.",
    "verify": "Please verify your email before logging in.",
    db: "Database unavailable. Check DATABASE_URL and that PostgreSQL is reachable.",
    locked: "Too many failed attempts. Please wait 15 minutes before trying again."
};
const loginErrorKey = params.get("error");

// Object.hasOwn, not a plain lookup: `?error=constructor` would otherwise match
// an inherited function off Object.prototype and render "[native code]".
if (loginErrorKey !== null && Object.hasOwn(loginMessages, loginErrorKey)) {
    loginError.textContent = loginMessages[loginErrorKey];
    loginError.hidden = false;
} else {
    loginError.hidden = true;
}
document.getElementById("registeredMessage").hidden = !params.has("registered");

if (params.get("deleted") === "1") {
    // The account and its server-side rows are gone. Drop the browser-side
    // copies too, otherwise a deleted user's travel history stays on disk.
    try {
        window.localStorage.removeItem("worldExplorerVisited");
        window.localStorage.removeItem("worldExplorerWishlist");
    } catch (error) {
        // localStorage can be unavailable in private mode; the notice still shows.
    }
    document.getElementById("deletedMessage").hidden = false;
}
</script>
</body>
</html>
